services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: pi-collector-postgres
    environment:
      POSTGRES_USER: picollector
      POSTGRES_PASSWORD: picollector
      POSTGRES_DB: picollector
    ports:
      - "5433:5432"
    volumes:
      - pi_collector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picollector -d picollector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pi_collector_pgdata:
