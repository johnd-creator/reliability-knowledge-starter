[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-collector"
version = "0.1.0"
description = "PI Web API time-series collector for BSR/BSR1 — serves trending dashboards and ML feature pipelines"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
picollector = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
