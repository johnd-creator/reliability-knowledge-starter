services:
  postgres:
    image: postgres:16-alpine
    container_name: maximo-collector-postgres
    environment:
      POSTGRES_USER: mxcollector
      POSTGRES_PASSWORD: mxcollector
      POSTGRES_DB: mxcollector
    ports:
      - "5434:5432"
    volumes:
      - maximo_collector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxcollector -d mxcollector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maximo_collector_pgdata:
