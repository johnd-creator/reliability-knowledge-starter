services:
  postgres:
    image: postgres:16-alpine
    container_name: cems-collector-postgres
    environment:
      POSTGRES_USER: cemscollector
      POSTGRES_PASSWORD: cemscollector
      POSTGRES_DB: cemscollector
    ports:
      - "5435:5432"
    volumes:
      - cems_collector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cemscollector -d cemscollector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cems_collector_pgdata:
