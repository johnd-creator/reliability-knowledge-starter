# CEMS parameter registry — the single source for the cems-collector.
#
# Provenance: ported from the DAZ production collector
# (docker/sensor-collector/config.yaml + database/seeders/ParameterSeeder.php,
# PLTU Suralaya, Beijer Box2Base Modbus TCP gateway 172.16.201.132:502 unit 1).
#
# status vocabulary (identical to the workspace catalogs):
#   unknown     — not tested, do not rely on it
#   documented  — from the DAZ production config, not yet re-verified against
#                 the live PLC from this workspace (current state)
#   verified    — tested with authorized read-only access — trust this
#
# `status` is the knowledge-trust value. The operational switch is `collect`
# (default true) — set `collect: false` to stop polling a parameter without
# deleting its registry entry.
#
# Modbus details live under `modbus:` and are quarantined from the
# contract-shaped core fields (they surface only under sources.cems).
#
# Legacy adjustment reference (1/sqldata.sql, kept here as documentation):
#   gases NOx/SO2/PM/CO2/Hg carried correction=7 (O2 reference 7%) and
#   constant=8.4; Laju_alir carried adjust=44.15625.
#
# VERIFIED against the production DAS (172.16.201.135/das, 2026-08-19):
# simultaneous PLC vs production-UI sampling showed the live pipeline is
#   value = raw x span x ((21-7)/(21-O2_measured))   [O2-corrected params]
#   value = raw x adjust                              [Laju_alir only]
#   value = raw                                      [O2, CO, Humidity, Pressure, Temp, Opacity]
# with span (calibration factor): SO2 0.4, NOx 0.5, PM 0.6, Flow 0.6 and 1.0
# otherwise. The DAZ Laravel gas conversion (x1.227) is NOT applied in
# production — normalization.enabled stays false for every parameter so the
# collector reproduces the production numbers (max deviation ~0.5%, from the
# O2 value the production collector feeds its correction).

stacks:
  - stack_id: "1"
    code: CB001
    name: Cerobong Unit 1 - PLTU Suralaya
    status: active
    description: Cerobong untuk Unit 1 Pembangkit Listrik Tenaga Uap (BSR)

parameters:
  - code: SO2
    name: Sulfur Dioxide
    unit: mg/Nm3
    status: documented
    threshold: 550.0
    modbus:
      register: 3150
      register_type: holding
      data_type: float32
      word_order: big
      byte_order: big
    normalization:
      enabled: false
    adjustment:
      o2_reference: 7.0
      adjust: 0.4
      constant: 0.0

