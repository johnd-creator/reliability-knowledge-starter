name: NADI Engineering candidate
on:
  pull_request:
    paths: ['deploy/development/**', 'reliability-cockpit/**', 'reliability-data-contracts/**', '.github/workflows/nadi-engineering-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nadi-engineering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nadi_application_test
        ports: ['5432:5432', '127.0.0.1:15953:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COCKPIT_CONFIG_MODE: managed
      DATABASE_URL: 'sqlite://'
      NADI_APPLICATION_TEST_DSN: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/nadi_application_test
      NADI_COMPLETE_HISTORY_TEST_DSN: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:15953/pdm_history_complete_ci_test
      NADI_HISTORY_PILOT_TEST_DSN: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:15953/pdm_history_pilot_ci_test
      NADI_MART_TEST_DSN: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/nadi_mart_test
      NADI_ENGINEERING_TEST_DSN: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/nadi_application_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e './reliability-cockpit[test]'
      - name: Create separate disposable condition Mart fixture database
        run: |
          python - <<'PYTHON'
          from sqlalchemy import create_engine
          engine = create_engine("postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/postgres", isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.exec_driver_sql("CREATE DATABASE nadi_mart_test")
              connection.exec_driver_sql("CREATE DATABASE pdm_history_pilot_ci_test")
              connection.exec_driver_sql("CREATE DATABASE pdm_history_complete_ci_test")
          engine.dispose()
          PYTHON
      - name: Select PostgreSQL 16 client tools for isolated restore qualification
        run: |
          test -x /usr/lib/postgresql/16/bin/pg_dump
          /usr/lib/postgresql/16/bin/pg_dump --version
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Application and trusted HTTP acceptance
        working-directory: reliability-cockpit
        env:
          PYTHONPATH: '.:tests'
        run: python -m unittest test_application_identity test_identity_adapter.AdapterTest test_application_migrations test_attachments test_session_cleanup test_bundle_d_http.RealHttpQaTest test_identity_configuration test_application_access test_attachment_readiness test_qa_limits test_qa_preflight test_qa_release test_bundle_e_rehearsal test_local_authentication test_local_login_http test_live_development test_frontend_preview test_local_development test_local_development_reusable test_source_preservation test_advisory.AdvisoryTest test_advisory_http.AdvisoryHttpTest test_advisory_http.AdvisorySchemaGateTest test_qa_advisory_schema test_integration_status test_phase1_read_integrity test_projection_acceptance.ProjectionPostgresAcceptanceTest test_integration_observations_client test_integration_ui_contract test_reports_ui_contract test_pdm_workbook_contract test_pdm_input.PdmInputTest test_pdm_input.PdmPostgresInputTest test_manual_inspection test_inspection_workflow test_auth03_self_identity test_auth03_readiness test_auth03_controller_update test_engineering test_engineering_qa test_recommendation_workflow test_engineering_integrity test_pdm_input_capture test_pdm_work_origin test_pdm_manual_follow_up test_pdm_history_staging test_pdm_workbook_reader test_pdm_history_pilot.HistoryPilotTest test_pdm_complete_plan test_pdm_source_history test_pdm_complete_postgres.CompleteHistoryPostgresTest -v
      - name: Canonical contracts
        working-directory: reliability-data-contracts
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated PdM browser test dependencies
        run: |
          npm ci --prefix reliability-cockpit/web
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Build actual PdM package test components
        working-directory: reliability-cockpit/web
        run: node scripts/pdm-follow-up-browser-bundle.mjs "$RUNNER_TEMP/nadi-pdm-package"
      - name: PdM package draft/session and actual UI-API-PostgreSQL regression
        working-directory: reliability-cockpit
        env:
          PYTHONPATH: '.:tests'
        run: |
          python web/scripts/pdm-auth-browser-check.py --bundle "$RUNNER_TEMP/nadi-pdm-package/candidate.js" --report "$RUNNER_TEMP/nadi-pdm-package/auth-results.json"
          python web/scripts/pdm-origin-api-browser-check.py --bundle "$RUNNER_TEMP/nadi-pdm-package/candidate.js" --css "$RUNNER_TEMP/nadi-pdm-package/candidate.css" --report "$RUNNER_TEMP/nadi-pdm-package/api-results.json"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reliability-cockpit/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:engineering && npm run check:phase2 && npm run check:workflow && npm run check:http-qa && npm run check:bounded-http && npm run check:bounded-proxy && npm run check:local-auth && npm run check:global-auth && npm run check:factual-policy && npm run check:product-safety
      - run: npm run check:ux && npm run check:eng-product && npm run check:engineering-fixes && npm run check:pdm-input && npm run check:integration && npm run check:reports && npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          COCKPIT_API_BASE: http://127.0.0.1:9
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Indonesian candidate browser regression (network-isolated fixtures)
        run: |
          npm install --prefix "$RUNNER_TEMP/nadi-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1 @axe-core/playwright@4.11.0
          node "$RUNNER_TEMP/nadi-browser/node_modules/playwright/cli.js" install --with-deps chromium
          NADI_AXE_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/@axe-core/playwright/dist/index.mjs" NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/localization-browser.mjs
          NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/pdm-input-browser.mjs
          NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/pdm-date-browser.mjs
          NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/pdm-source-history-browser.mjs
          NADI_AXE_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/@axe-core/playwright/dist/index.mjs" NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/integration-browser.mjs
          NADI_AXE_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/@axe-core/playwright/dist/index.mjs" NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/reports-browser.mjs
          NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/login-visual-browser.mjs
          NADI_AXE_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/@axe-core/playwright/dist/index.mjs" NADI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/nadi-browser/node_modules/playwright/index.mjs" node scripts/experience-browser.mjs
