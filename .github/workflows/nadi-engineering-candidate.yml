name: NADI Engineering candidate
on:
  pull_request:
    paths: ['reliability-cockpit/**', 'reliability-data-contracts/**', '.github/workflows/nadi-engineering-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nadi-engineering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: nadi_application_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COCKPIT_CONFIG_MODE: managed
      DATABASE_URL: 'sqlite://'
      NADI_APPLICATION_TEST_DSN: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/nadi_application_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e './reliability-cockpit[test]'
      - name: Application and trusted HTTP acceptance
        working-directory: reliability-cockpit
        env:
          PYTHONPATH: '.:tests'
        run: python -m unittest test_application_identity test_identity_adapter.AdapterTest test_application_migrations test_attachments test_session_cleanup test_bundle_d_http.RealHttpQaTest -v
      - name: Canonical contracts
        working-directory: reliability-data-contracts
        run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reliability-cockpit/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:engineering && npm run check:phase2 && npm run check:workflow && npm run check:http-qa && npm run check:product-safety
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          COCKPIT_API_BASE: http://127.0.0.1:9
          NEXT_TELEMETRY_DISABLED: '1'
