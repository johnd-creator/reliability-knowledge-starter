name: NADI Maximo collector

on:
  pull_request:
    paths:
      - 'maximo-collector/**'
      - 'reliability-data-contracts/**'
      - '.github/scripts/maximo_ci/**'
      - '.github/workflows/nadi-maximo-collector.yml'
      - 'docs/ci/**'
  push:
    branches: [main]
    paths:
      - 'maximo-collector/**'
      - 'reliability-data-contracts/**'
      - '.github/scripts/maximo_ci/**'
      - '.github/workflows/nadi-maximo-collector.yml'
      - 'docs/ci/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR targeting main'
        required: true
        type: string
      expected_sha:
        description: 'Expected current PR HEAD, full lowercase 40-character SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maximo-ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Verify exact source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      pr: ${{ steps.source.outputs.pr }}
    steps:
      - name: Checkout immutable workflow tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          persist-credentials: false
      - name: Verify requested source against current GitHub PR metadata
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PR: ${{ inputs.pr_number }}
          REQUEST_SHA: ${{ inputs.expected_sha }}
        run: python ci-tools/.github/scripts/maximo_ci/qualify.py select

  collector:
    name: Maximo offline / Python ${{ matrix.python }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout immutable workflow tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout exact selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.select.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Verify source identity
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
        run: python ci-tools/.github/scripts/maximo_ci/qualify.py checkout --source source
      - name: Install collector and qualification test dependencies
        run: python -m pip install ./source/maximo-collector PyYAML==6.0.3
      - name: Workflow and negative safety regressions
        run: python -m unittest discover -s ci-tools/.github/scripts/maximo_ci/tests -v
      - name: Full offline collector suite (no silent skips)
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python ci-tools/.github/scripts/maximo_ci/run_offline.py
          --root source/maximo-collector --sha "$TESTED_SHA"
          --report "$RUNNER_TEMP/maximo-offline-${{ matrix.python }}.json"
      - name: Six private-file recovery rehearsals (owned temp root only)
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python ci-tools/.github/scripts/maximo_ci/run_rehearsal.py
          --root source/maximo-collector --sha "$TESTED_SHA"
          --report "$RUNNER_TEMP/maximo-rehearsal-${{ matrix.python }}.json"
      - name: Verify tracked source unchanged after tests
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
        run: python ci-tools/.github/scripts/maximo_ci/qualify.py checkout --source source

  postgres:
    name: B1+B2 disposable PostgreSQL / Python ${{ matrix.python }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout immutable workflow tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout exact selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.select.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Verify source identity
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
        run: python ci-tools/.github/scripts/maximo_ci/qualify.py checkout --source source
      - name: Install collector for isolated qualification
        run: python -m pip install ./source/maximo-collector
      - name: Verify available disposable server binaries
        run: test -x /usr/lib/postgresql/16/bin/initdb
      - name: B1+B2 real PostgreSQL transaction qualification (Unix-only private cluster)
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python ci-tools/.github/scripts/maximo_ci/run_projection_pg.py
          --root source/maximo-collector --sha "$TESTED_SHA"
          --report "$RUNNER_TEMP/maximo-pg-${{ matrix.python }}.json"
      - name: Verify tracked source unchanged after tests
        if: ${{ always() }}
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
        run: python ci-tools/.github/scripts/maximo_ci/qualify.py checkout --source source

  gate:
    name: Maximo qualification gate
    needs: [select, collector, postgres]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout immutable workflow tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          persist-credentials: false
      - name: Refuse failed or incomplete qualification
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          COLLECTOR_RESULT: ${{ needs.collector.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$COLLECTOR_RESULT" = success
          test "$POSTGRES_RESULT" = success
      - name: Recheck current PR HEAD in a fresh runner without candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.select.outputs.sha }}
          SELECTED_PR: ${{ needs.select.outputs.pr }}
        run: python ci-tools/.github/scripts/maximo_ci/qualify.py recheck
      - name: Record gate provenance
        env:
          TESTED_SHA: ${{ needs.select.outputs.sha }}
          SELECTED_PR: ${{ needs.select.outputs.pr }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '## Maximo qualification gate: PASS\n\nTested SHA: `%s`\n\nPR: `%s`\n\nWorkflow SHA: `%s`\n\nRun: %s\n' "$TESTED_SHA" "$SELECTED_PR" "$CI_WORKFLOW_SHA" "$CI_RUN_URL" >> "$GITHUB_STEP_SUMMARY"
